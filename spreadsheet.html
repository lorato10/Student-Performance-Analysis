<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Excellence Database - Google Sheets</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        body { margin: 0; font-family: 'Roboto', sans-serif; background: #fff; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        .sheet-topbar { background: #f9fbfd; border-bottom: 1px solid #e0e0e0; padding: 8px 16px; display: flex; align-items: center; gap: 16px; }
        .sheet-icon { width: 40px; height: 40px; }
        .sheet-info h1 { margin: 0; font-size: 18px; font-weight: 500; color: #202124; line-height: 24px; }
        .sheet-menu { font-size: 13px; color: #5f6368; display: flex; gap: 12px; margin-top: 2px; }
        .sheet-menu span { cursor: pointer; padding: 2px 4px; border-radius: 4px; }
        .sheet-menu span:hover { background: #e8eaed; }
        .sheet-toolbar { background: #edf2fa; border-bottom: 1px solid #e0e0e0; padding: 6px 16px; display: flex; gap: 16px; align-items: center; border-radius: 24px; margin: 8px 16px; width: fit-content; }
        
        .grid-container { flex: 1; overflow: auto; display: flex; flex-direction: column; }
        table { border-collapse: collapse; font-size: 12px; color: #000; min-width: max-content; }
        th, td { border: 1px solid #c0c0c0; padding: 4px 8px; white-space: nowrap; height: 21px; box-sizing: border-box; }
        th { background: #f8f9fa; font-weight: 400; text-align: center; color: #5f6368; user-select: none; }
        .row-header { width: 46px; background: #f8f9fa; color: #5f6368; text-align: center; }
        .header-row th { position: sticky; top: 0; background: #f8f9fa; z-index: 10; border-bottom: 1px solid #c0c0c0; }
        .header-col { position: sticky; left: 0; z-index: 11; }
        .header-row .header-col { z-index: 12; }
        td:focus { outline: 2px solid #1a73e8; outline-offset: -2px; }
        .download-btn { background: #1a73e8; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: 500; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px; margin-left: auto; }
        .download-btn:hover { background: #1557b0; }
    </style>
</head>
<body>

    <div class="sheet-topbar">
        <svg class="sheet-icon" viewBox="0 0 40 40"><path fill="#0F9D58" d="M28 10.5h-5.5v18h5.5c1.1 0 2-.9 2-2v-14c0-1.1-.9-2-2-2z"></path><path fill="#34A853" d="M10 10.5h12.5v18H10z"></path><path fill="#1AA15F" d="M10 10.5h12.5v4.5H10z"></path><path fill="#000" fill-opacity=".1" d="M10 24h12.5v4.5H10z"></path><path fill="#E8EAED" d="M12.5 15h7.5v3h-7.5zM12.5 20h7.5v3h-7.5z"></path></svg>
        <div class="sheet-info">
            <h1 id="docTitle">Excellence Live Database (Sync)</h1>
            <div class="sheet-menu">
                <span>File</span><span>Edit</span><span>View</span><span>Insert</span><span>Format</span><span>Data</span><span>Tools</span><span>Extensions</span><span>Help</span>
            </div>
        </div>
        <button class="download-btn" onclick="downloadCSV()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Download CSV
        </button>
    </div>

    <div class="sheet-toolbar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span style="color: #5f6368; font-size: 14px; margin-left: 8px;">100%</span>
        <div style="width: 1px; height: 16px; background: #dadce0;"></div>
        <strong style="color: #5f6368; font-size: 14px; font-family: serif;">$ % .00 123</strong>
        <div style="width: 1px; height: 16px; background: #dadce0;"></div>
        <span style="color: #5f6368; font-size: 14px;">Arial</span>
        <span style="color: #5f6368; font-size: 14px;">10</span>
        <div style="width: 1px; height: 16px; background: #dadce0;"></div>
        <strong style="color: #5f6368; font-size: 14px;">B <i>I</i> <s>S</s> A</strong>
    </div>

    <div class="grid-container">
        <table id="sheetTable">
            <thead>
                <tr class="header-row">
                    <th class="header-col row-header"></th>
                    <th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th><th>G</th><th>H</th><th>I</th><th>J</th><th>K</th>
                </tr>
                <tr class="header-row" style="top: 30px;">
                    <th class="header-col row-header" style="background:#e8eaed">1</th>
                    <th style="font-weight: 700; background:#f1f3f4">ID</th>
                    <th style="font-weight: 700; background:#f1f3f4">Name</th>
                    <th style="font-weight: 700; background:#f1f3f4">Role Type</th>
                    <th style="font-weight: 700; background:#f1f3f4">Class / Domain</th>
                    <th style="font-weight: 700; background:#f1f3f4">Duration</th>
                    <th style="font-weight: 700; background:#f1f3f4">Half Yearly %</th>
                    <th style="font-weight: 700; background:#f1f3f4">Annual %</th>
                    <th style="font-weight: 700; background:#f1f3f4">Projects Done</th>
                    <th style="font-weight: 700; background:#f1f3f4">Overall Marks</th>
                    <th style="font-weight: 700; background:#f1f3f4">Attendance %</th>
                    <th style="font-weight: 700; background:#f1f3f4">Funds / Fee (₹)</th>
                </tr>
            </thead>
            <tbody id="sheetBody">
                <tr><td colspan="12" style="text-align: center; padding: 20px;">Loading database sync...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const db = firebase.database();
        let currentData = [];

        db.ref('students').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            const tbody = document.getElementById('sheetBody');
            tbody.innerHTML = '';
            
            const arr = [];
            for (let key in data) arr.push(data[key]);

            // Sort Students first, then Interns
            arr.sort((a, b) => a.type.localeCompare(b.type));
            currentData = arr;

            if (arr.length === 0) {
                tbody.innerHTML = '<tr><td colspan="12" style="text-align: center;">No records found.</td></tr>';
                return;
            }

            arr.forEach((s, index) => {
                // Calculate attendance
                let log = s.attendanceLog || {};
                let totalRecorded = Object.keys(log).length;
                let att = 0;
                if (totalRecorded > 0) {
                    let presentCount = Object.values(log).filter(v => v === 'Present').length;
                    att = Math.min(100, Math.round((presentCount / (parseInt(s.totalDays || totalRecorded))) * 100));
                } else if (s.attendance) {
                    att = s.attendance;
                }

                // Funds
                let funds = 0;
                if (s.type === 'Student') funds = 35000;
                else if (s.type === 'Intern') funds = 15000;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <th class="header-col row-header">${index + 2}</th>
                    <td tabindex="0">${s.id || ''}</td>
                    <td tabindex="0">${s.name || ''}</td>
                    <td tabindex="0">${s.type || ''}</td>
                    <td tabindex="0">${s.dept || ''}</td>
                    <td tabindex="0">${s.duration || ''}</td>
                    <td tabindex="0">${s.type === 'Student' ? (s.halfYearly || 0) + '%' : '-'}</td>
                    <td tabindex="0">${s.type === 'Student' ? (s.annual || 0) + '%' : '-'}</td>
                    <td tabindex="0">${s.type === 'Intern' ? (s.projectsDone || 0) : '-'}</td>
                    <td tabindex="0">${s.marks || 0}%</td>
                    <td tabindex="0">${att}%</td>
                    <td tabindex="0">₹${funds.toLocaleString('en-IN')}</td>
                `;
                tbody.appendChild(tr);
            });
            
            // Add some empty rows at bottom to simulate spreadsheet feel
            for(let i=0; i<30; i++) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<th class="header-col row-header">${arr.length + 2 + i}</th><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>`;
                tbody.appendChild(tr);
            }
        });

        function downloadCSV() {
            if (!currentData || currentData.length === 0) return alert("No data available to download.");
            
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "ID,Name,Role Type,Class / Domain,Duration,Half Yearly %,Annual %,Projects Done,Overall Marks,Attendance %,Funds / Fee (INR)\n";
            
            currentData.forEach(s => {
                let log = s.attendanceLog || {};
                let totalRecorded = Object.keys(log).length;
                let att = 0;
                if (totalRecorded > 0) {
                    let presentCount = Object.values(log).filter(v => v === 'Present').length;
                    att = Math.min(100, Math.round((presentCount / (parseInt(s.totalDays || totalRecorded))) * 100));
                } else if (s.attendance) att = s.attendance;

                let funds = s.type === 'Student' ? 35000 : 15000;
                
                const row = [
                    `"${s.id || ''}"`,
                    `"${s.name || ''}"`,
                    `"${s.type || ''}"`,
                    `"${s.dept || ''}"`,
                    `"${s.duration || ''}"`,
                    s.type === 'Student' ? (s.halfYearly || 0) : '',
                    s.type === 'Student' ? (s.annual || 0) : '',
                    s.type === 'Intern' ? (s.projectsDone || 0) : '',
                    (s.marks || 0),
                    att,
                    funds
                ];
                csvContent += row.join(",") + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Excellence_Database_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
